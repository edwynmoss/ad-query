name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Typecheck
        working-directory: app/frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: app/frontend
        run: npx vitest run

      - name: Frontend build
        working-directory: app/frontend
        run: npm run build

      # The Go side embeds frontend/dist, so this runs after the frontend
      # build. Regenerating the bindings here catches drift against the
      # committed wailsjs/ as a failing diff rather than a broken typecheck.
      - name: Bindings match the Go API
        working-directory: app
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          wails generate module
          git diff --exit-code -- frontend/wailsjs || (echo "wailsjs bindings are stale: run 'wails generate module' and commit" && exit 1)

      - name: Go build, vet and tests (includes the read-only guard)
        working-directory: app
        run: |
          go build ./...
          go vet ./...
          go test ./...
